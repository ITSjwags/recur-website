[build]
  command = "yarn install && yarn build"
  publish = "dist"

[build.environment]
  NODE_ENV = "production"
  NODE_VERSION = "22"

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

# HeyCatch short links
[[redirects]]
  from = "/a"
  to = "/?utm_source=heycatch&utm_campaign=a"
  status = 302

