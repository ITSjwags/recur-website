kind = "web"
previewPath = "/"
title = "Recur — Strength Training App"
version = "1.0.0"
id = "artifacts/recur-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22936

[services.development]
run = "pnpm --filter @workspace/recur-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/recur-website", "run", "build" ]
publicDir = "artifacts/recur-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22936"
BASE_PATH = "/"
