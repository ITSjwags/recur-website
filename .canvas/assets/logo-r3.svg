<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Concept: the return arrow IS the dot on the "i" of recur — wait, recur has no i -->
  <!-- Instead: a teal square app icon with just the circular return arrow inside (no letter) -->
  <!-- Clean, bold, unambiguous — wordmark handles the name -->

  <rect width="120" height="120" rx="24" fill="#3A6F73"/>

  <!-- Bold return arrow centered in the square -->
  <!-- Center (60,62), radius 28 -->
  <path d="M82 40 A28 28 0 1 0 48 32"
        fill="none" stroke="white" stroke-width="12" stroke-linecap="round"/>

  <!-- Arrowhead at (48,32) pointing left-and-down -->
  <path d="M42 43 L46 30 L58 35"
        fill="none" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
