<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- SVG text "r" in Inter, with a subtle return arc as a companion mark -->
  <!-- Using system sans-serif as close to Inter as possible -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700&amp;display=swap');
    </style>
  </defs>

  <!-- Bold r letterform, left-aligned -->
  <text x="10" y="88"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-weight="700"
        font-size="88"
        fill="#3A6F73">r</text>

  <!-- Small return arc at top-right: a visual counterpart showing "recur" -->
  <!-- Sits in the negative space upper-right of the r -->
  <path d="M92 24 A14 14 0 1 0 80 12"
        fill="none" stroke="#9FB8A0" stroke-width="5" stroke-linecap="round"/>
  <path d="M74 16 L79 11 L84 18"
        fill="none" stroke="#9FB8A0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
