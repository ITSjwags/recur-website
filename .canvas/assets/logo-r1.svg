<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Clean circular return arrow — no letterform fusion, just the motion mark -->
  <!-- A bold teal ring with a gap at top-right and an arrowhead pointing counter-clockwise (return) -->

  <!-- Nearly full circle: CCW from ~1 o'clock, leaving a gap at top -->
  <!-- Center (60,62), radius 30 -->
  <path d="M84 38 A30 30 0 1 0 46 30"
        fill="none" stroke="#3A6F73" stroke-width="12" stroke-linecap="round"/>

  <!-- Arrowhead at (46,30) pointing left-down (direction of CCW motion at ~10 o'clock) -->
  <path d="M40 40 L44 28 L56 32"
        fill="none" stroke="#3A6F73" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
