<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <rect width="120" height="120" rx="26" fill="#3A6F73"/>
  <!-- Bold geometric r: thick strokes, well centred in the square -->
  <!-- Stem: x=36, full height -->
  <line x1="36" y1="90" x2="36" y2="26" stroke="white" stroke-width="13" stroke-linecap="round"/>
  <!-- Arch: branches at mid-stem, peaks high, ends at shoulder height — no descender -->
  <!-- Symmetric cubic bezier: rises to top then comes across -->
  <path d="M36 46 C36 20 84 20 84 48"
        stroke="white" stroke-width="13" stroke-linecap="round" fill="none"/>
</svg>
