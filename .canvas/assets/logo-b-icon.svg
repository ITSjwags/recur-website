<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Circle center (60,60), radius 38 -->
  <!-- Arc starts at ~1 o'clock (79,27), goes clockwise ~330° to just before 12 o'clock (63,22) -->
  <!-- Gap sits at the top — clean and readable -->
  <path d="M79 27 A38 38 0 1 1 63 22"
        fill="none" stroke="#3A6F73" stroke-width="8" stroke-linecap="round"/>
  <!-- Arrowhead at (63,22): tangent at this point is nearly horizontal-left -->
  <!-- V-shape: base near arc end, tip extending in direction of motion (left) -->
  <path d="M62 16 L52 22 L62 28"
        fill="none" stroke="#3A6F73" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
