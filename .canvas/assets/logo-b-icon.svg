<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- U-turn / return arrow — the "come back" concept, clean and unambiguous -->
  <!-- Left arm: goes down -->
  <!-- U-curve: sweeps across the bottom -->
  <!-- Right arm: comes back up with arrowhead at top -->
  <path d="M32 36 L32 70 C32 94 88 94 88 70 L88 36"
        stroke="#3A6F73" stroke-width="11" stroke-linecap="round" fill="none"/>
  <!-- Arrowhead at top of right arm pointing up -->
  <path d="M79 48 L88 32 L97 48"
        stroke="#3A6F73" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
